# =============================================================
# Conexion a PostgreSQL (ambiente de ejecucion)
# Completar con las credenciales reales del servidor local.
# La base de datos debe existir (ver database/crear_base_datos.sql).
# =============================================================
hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://localhost:5432/veterinaria_db
hibernate.connection.username=postgres
hibernate.connection.password=12345678

hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
